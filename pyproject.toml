[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-public-change-feed"
version = "0.1.0"
description = "Route-scoped review candidates from public AWS announcement feeds"
requires-python = ">=3.12"
license = "Apache-2.0"
# Pinned in requirements.txt, which ADR-006 makes the production pin file.
# The range here stays compatible with it rather than restating the pin.
dependencies = ["boto3>=1.43,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
mypy_path = "src"

# The runtime package is strict from its first file. Retrofitting strict mode
# across a grown codebase is materially harder than starting there. The
# validator scripts and tests predate this baseline and keep the settings
# above.
#
# The sub-flags are listed individually on purpose: `strict = true` in a
# per-module override is read as the global flag and turns strict mode on for
# the whole repository, which would fail the existing scripts and tests.
[[tool.mypy.overrides]]
module = "aws_public_change_feed.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# `boto3` and `botocore` ship no type information. Stub packages exist, but
# they are large, they version independently of the SDK, and the only code
# importing them is `tests/test_s3_preconditions.py`, which asserts HTTP status
# codes and error strings rather than SDK types. Revisit when the milestone-2
# publisher lands in `src/`, where the strict overrides above do apply.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
