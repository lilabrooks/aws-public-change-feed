<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" width="1920" height="1080" viewBox="0 0 1920 1080"><title id="title">Architecture, delivery, and operations</title><rect width="1920" height="1080" fill="#0b1320" /><text x="100" y="85" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#60b5ff">AWS PUBLIC CHANGE ALERTING</text><text x="100" y="174" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#f3f6fb">Architecture, delivery, and operations</text><text x="100" y="237" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">Public AWS RSS and Atom feeds · configured service and risk matching</text><rect x="100" y="335" width="530" height="210" rx="18" fill="#142235" stroke="#29415e" stroke-width="2" /><text x="130" y="405" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">PUBLIC AWS FEEDS</text><text x="130" y="479" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">RSS and Atom</text><rect x="695" y="335" width="530" height="210" rx="18" fill="#142235" stroke="#29415e" stroke-width="2" /><text x="725" y="405" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">DETERMINISTIC MATCH</text><text x="725" y="479" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">Service + risk phrase</text><rect x="1290" y="335" width="530" height="210" rx="18" fill="#142235" stroke="#29415e" stroke-width="2" /><text x="1320" y="405" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">SLACK DELIVERY</text><text x="1320" y="479" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">Recorded in DynamoDB</text><path d="M640 438H681" stroke="#60b5ff" stroke-width="4" /><path d="M669 427L681 438 669 449" stroke="#60b5ff" stroke-width="4" fill="none" /><path d="M1235 438H1276" stroke="#60b5ff" stroke-width="4" /><path d="M1264 427L1276 438 1264 449" stroke="#60b5ff" stroke-width="4" fill="none" /><path d="M100 990H1820" stroke="#29415e" stroke-width="2" /><text x="100" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">Public feeds · exact releases · durable delivery state</text><text x="1370" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">© 2026 Lila Brooks · Apache-2.0</text><text x="100" y="650" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#f3f6fb">Every candidate retains the matched text, route, and exact release.</text><text x="100" y="719" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#f3f6fb">Static profiles identify potentially relevant environments.</text><text x="100" y="826" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#60b5ff">Lambda workflow · conditional writes · retries and recovery</text><text x="100" y="888" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#a9b8cb">Live delivery evidence and supervised operation</text></svg>
