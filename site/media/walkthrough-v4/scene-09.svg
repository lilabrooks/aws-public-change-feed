<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">Supervised windows with durable cleanup</title><rect width="1920" height="1080" fill="#0b1320"/><text x="100" y="85" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#60b5ff">AWS PUBLIC CHANGE ALERTING</text><text x="1740" y="85" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#a9b8cb">09 / 10</text><text x="100" y="174" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#f3f6fb">Supervised windows with durable cleanup</text><text x="100" y="237" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">M4 · fixed observation, early parking, and deadline cleanup after local waiter loss</text><path d="M100 990H1820" stroke="#29415e" stroke-width="2"/><text x="100" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">Source: ADR-030 · September 8 supervised qualification</text><text x="1370" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">© 2026 Lila Brooks · Apache-2.0</text><rect x="100" y="298" width="530" height="230" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="130" y="351" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">STEP FUNCTIONS</text><text x="130" y="406" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Owns the original deadline</text><text x="130" y="451" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Waits for callback or timeout</text><text x="130" y="496" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Survives local waiter loss</text><rect x="695" y="298" width="530" height="230" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="725" y="351" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">CODEBUILD + TERRAFORM</text><text x="725" y="406" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Applies reviewed phase plans</text><text x="725" y="451" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Activates, drains, then parks</text><text x="725" y="496" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Pins the immutable S3 bundle</text><rect x="1290" y="298" width="530" height="230" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="1320" y="351" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">PARKED READBACK</text><text x="1320" y="406" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">4 triggers disabled</text><text x="1320" y="451" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">5 functions at concurrency 0</text><text x="1320" y="496" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">28 alarms + dashboard absent</text><path d="M640 413h41l-12 -11m12 11l-12 11" stroke="#60b5ff" stroke-width="4" fill="none"/><path d="M1235 413h41l-12 -11m12 11l-12 11" stroke="#60b5ff" stroke-width="4" fill="none"/><rect x="100" y="580" width="1720" height="220" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="130" y="633" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">FIXED 20-MINUTE OBSERVATION</text><text x="130" y="688" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Watcher / dispatcher / reconciler: 1 / 20 / 4 invocations and heartbeats</text><text x="130" y="733" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">0 scheduled-function errors or throttles; no new Slack posts</text><text x="130" y="778" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">The quiet cohort ended at its declared boundary.</text><text x="100" y="865" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#52d5aa">Operator stays available through independent parked verification.</text><text x="100" y="922" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">Unattended notification qualification remains pending. Retained resources can still cost.</text></svg>
