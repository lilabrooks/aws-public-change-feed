<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" width="1920" height="1080" viewBox="0 0 1920 1080"><title id="title">Twelve posts reached Slack. Recovery and load ran.</title><rect width="1920" height="1080" fill="#0b1320"/><text x="100" y="85" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#60b5ff">M1 · CLOSED</text><text x="1740" y="85" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#a9b8cb">04 / 10</text><text x="100" y="174" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#f3f6fb">Twelve posts reached Slack. Recovery and load ran.</text><text x="100" y="237" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">The 12-message live cohort also has 12 posted records in DynamoDB.</text><rect x="100" y="320" width="530" height="300" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="132" y="432" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" fill="#60b5ff">12</text><text x="132" y="494" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#f3f6fb">Live public-feed posts</text><text x="132" y="559" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#a9b8cb">1 attempt + HTTP 200 per post</text><rect x="695" y="320" width="530" height="300" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="727" y="432" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" fill="#60b5ff">50</text><text x="727" y="494" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#f3f6fb">Isolated load records</text><text x="727" y="559" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#a9b8cb">5 per minute × 10 minutes</text><rect x="1290" y="320" width="530" height="300" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="1322" y="432" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" fill="#60b5ff">2</text><text x="1322" y="494" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#f3f6fb">Isolated recovery cases</text><text x="1322" y="559" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#a9b8cb">Pending work + expired send lease</text><rect x="100" y="685" width="1720" height="230" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="140" y="748" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#52d5aa">Recovery outcomes</text><text x="140" y="812" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">pending_queue → posted: 1 Slack attempt</text><text x="140" y="864" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">Expired sending lease → delivery_unknown: 0 further Slack attempts</text><path d="M100 990H1820" stroke="#29415e" stroke-width="2"/><text x="100" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">Source: README M1 record · owner-confirmed alarm email</text><text x="1370" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">© 2026 Lila Brooks · Apache-2.0</text></svg>
