<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" width="1920" height="1080" viewBox="0 0 1920 1080"><title id="title">Test the package transition without creating deliveries.</title><rect width="1920" height="1080" fill="#0b1320"/><text x="100" y="85" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#60b5ff">M3 · ROLLBACK PROOF</text><text x="1740" y="85" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#a9b8cb">07 / 10</text><text x="100" y="174" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#f3f6fb">Test the package transition without creating deliveries.</text><text x="100" y="237" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">Predecessor and restored successor were each evaluated through shadow.</text><rect x="100" y="310" width="1720" height="118" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="140" y="365" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#60b5ff">Reuse earlier evidence where the claim still holds.</text><text x="140" y="407" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">Configuration rollback already passed; application rollback was the missing test.</text><rect x="100" y="510" width="530" height="210" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="130" y="570" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#52d5aa">START</text><text x="130" y="637" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#f3f6fb">1ae996ca…</text><text x="130" y="692" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">Genuine successor</text><rect x="695" y="510" width="530" height="210" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="725" y="570" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#52d5aa">ROLL BACK</text><text x="725" y="637" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#f3f6fb">c88b49c8…</text><text x="725" y="692" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">Qualified predecessor</text><rect x="1290" y="510" width="530" height="210" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="1320" y="570" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#52d5aa">RESTORE</text><text x="1320" y="637" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#f3f6fb">1ae996ca…</text><text x="1320" y="692" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">Exact successor restored</text><path d="M638 615H681" stroke="#60b5ff" stroke-width="4"/><path d="M669 604L681 615 669 626" stroke="#60b5ff" stroke-width="4" fill="none"/><path d="M1233 615H1276" stroke="#60b5ff" stroke-width="4"/><path d="M1264 604L1276 615 1264 626" stroke="#60b5ff" stroke-width="4" fill="none"/><text x="100" y="815" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="400" fill="#f3f6fb">All 5 Lambdas changed package while durable execution stayed paused.</text><text x="100" y="884" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#a9b8cb">One shadow run per tested version: 240 items → the same 8 candidate identities</text><path d="M100 990H1820" stroke="#29415e" stroke-width="2"/><text x="100" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">Source: L-54 application rollback record · ADR-026</text><text x="1370" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">© 2026 Lila Brooks · Apache-2.0</text></svg>
