<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">Maintenance that preserves the contracts</title><rect width="1920" height="1080" fill="#0b1320"/><text x="100" y="85" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#60b5ff">AWS PUBLIC CHANGE ALERTING</text><text x="1740" y="85" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#a9b8cb">10 / 10</text><text x="100" y="174" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#f3f6fb">Maintenance that preserves the contracts</text><text x="100" y="237" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">M5 · four repository-only improvements; no AWS activation</text><path d="M100 990H1820" stroke="#29415e" stroke-width="2"/><text x="100" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">Source: M5 · issues #118, #108, #194, and #65</text><text x="1370" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">© 2026 Lila Brooks · Apache-2.0</text><rect x="100" y="305" width="830" height="255" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="130" y="358" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">TRACKED AGENT ADAPTERS</text><text x="130" y="413" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Reject added process, environment, headers,</text><text x="130" y="458" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">tokens, or authentication fields.</text><text x="130" y="503" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Host-global settings remain outside these tests.</text><rect x="990" y="305" width="830" height="255" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="1020" y="358" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">CLI HELP CONTRACTS</text><text x="1020" y="413" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Normalize line wrapping across terminal widths.</text><text x="1020" y="458" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Still require the absolute-path wording</text><text x="1020" y="503" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">independently in both executables.</text><rect x="100" y="610" width="830" height="255" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="130" y="663" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">PACKAGE MANIFEST VERIFICATION</text><text x="130" y="718" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Keep the synthetic public example stable.</text><text x="130" y="763" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Recompute current-source manifests separately.</text><text x="130" y="808" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Preserve package identity and publication gates.</text><rect x="990" y="610" width="830" height="255" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="1020" y="663" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#60b5ff">FEED-CLAIM PARITY</text><text x="1020" y="718" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Expired lease + changed URL: refuse unchanged.</text><text x="1020" y="763" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Success: 1 UpdateItem, 0 GetItem calls.</text><text x="1020" y="808" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f3f6fb">Refusal: 1 conditional update + 1 strong read.</text><text x="100" y="935" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#52d5aa">Service contracts and the supervised operating boundary remain unchanged.</text></svg>
