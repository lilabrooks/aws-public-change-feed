<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" width="1920" height="1080" viewBox="0 0 1920 1080"><title id="title">Bound retained history. Inspect replay before apply.</title><rect width="1920" height="1080" fill="#0b1320"/><text x="100" y="85" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#60b5ff">M2 · CLOSED</text><text x="1740" y="85" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#a9b8cb">05 / 10</text><text x="100" y="174" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#f3f6fb">Bound retained history. Inspect replay before apply.</text><text x="100" y="237" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">Keep active acquisition separate from replaying one retained feed response.</text><rect x="100" y="320" width="760" height="460" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="140" y="386" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#60b5ff">164 existing rows migrated</text><text x="140" y="465" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#f3f6fb">76 announcement rows</text><text x="140" y="531" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#f3f6fb">88 response-page rows</text><text x="140" y="597" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#f3f6fb">730-day expiry policy</text><text x="140" y="663" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#f3f6fb">4 active checkpoints left alone</text><rect x="920" y="320" width="900" height="460" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="960" y="386" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#52d5aa">Retained-source replay</text><text x="960" y="465" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#f3f6fb">Bind one exact saved response</text><text x="960" y="531" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#f3f6fb">Pin the retained configuration version</text><text x="960" y="597" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#f3f6fb">Inspect state before reviewing the plan</text><text x="960" y="663" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#f3f6fb">Fill gaps; reuse existing candidates</text><text x="100" y="872" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#a9b8cb">Replay has no feed-checkpoint access. No live source replay was applied.</text><path d="M100 990H1820" stroke="#29415e" stroke-width="2"/><text x="100" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">Source: README M2 record · retained-source replay specification</text><text x="1370" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">© 2026 Lila Brooks · Apache-2.0</text></svg>
