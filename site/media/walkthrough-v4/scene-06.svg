<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" width="1920" height="1080" viewBox="0 0 1920 1080"><title id="title">The global score passes; historical coverage is thin.</title><rect width="1920" height="1080" fill="#0b1320"/><text x="100" y="85" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#60b5ff">MATCHING EVIDENCE</text><text x="1740" y="85" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#a9b8cb">06 / 10</text><text x="100" y="174" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#f3f6fb">The global score passes; historical coverage is thin.</text><text x="100" y="237" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#a9b8cb">The accepted policy carries the sample limits into the readiness decision.</text><rect x="100" y="320" width="820" height="420" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="140" y="399" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#60b5ff">47 labeled items</text><text x="140" y="471" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="400" fill="#a9b8cb">32 historical + 15 synthetic</text><text x="140" y="550" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">29 true-positive service/risk pairs</text><text x="140" y="611" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">0 false positives · 0 false negatives</text><text x="140" y="672" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">Precision 1.000 · recall 1.000</text><rect x="980" y="320" width="840" height="420" rx="18" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="1020" y="399" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#52d5aa">6 of 12 configured pairs</text><text x="1020" y="477" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">Have no historical positive</text><text x="1020" y="550" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">Synthetic cases test the contract</text><text x="1020" y="623" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f3f6fb">Recall on real AWS wording is unproved</text><text x="100" y="842" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#f3f6fb">The policy retained EKS, RDS, Lambda, and all four risk rules.</text><text x="100" y="908" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#a9b8cb">Global floors remain precision ≥ 0.950 and recall ≥ 0.800.</text><path d="M100 990H1820" stroke="#29415e" stroke-width="2"/><text x="100" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">Source: production-policy.md · ADR-018</text><text x="1370" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a9b8cb">© 2026 Lila Brooks · Apache-2.0</text></svg>
