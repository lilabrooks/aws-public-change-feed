<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="600" height="960" viewBox="0 0 600 960"><title id="title">How production readiness was established</title><desc id="desc">A fixed deployment scope frames the review. Earlier evidence is checked against relevant changes. New application rollback and restored-operation evidence join final source and CI verification in the readiness assessment. The owner accepts a decision limited to that deployment.</desc><rect width="600" height="960" rx="22" fill="#0b1320"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#60b5ff"/></marker></defs><text x="35" y="54" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#f3f6fb">How readiness was established</text><rect x="30" y="82" width="540" height="112" rx="20" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="52" y="123" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#60b5ff">Define the operating boundary</text><text x="52" y="163" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#f3f6fb">Exact deployment and acceptance criteria</text><path d="M300 197L300 226" stroke="#60b5ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="235" width="540" height="155" rx="20" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="52" y="277" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#60b5ff">Review earlier evidence</text><text x="52" y="318" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#f3f6fb">Matching, delivery, load, recovery</text><text x="52" y="357" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#f3f6fb">Reuse only where the claim still holds</text><path d="M300 393L300 422" stroke="#60b5ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="430" width="540" height="155" rx="20" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="52" y="472" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#52d5aa">Add the missing live proof</text><text x="52" y="513" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#f3f6fb">Five-function rollback and restoration</text><text x="52" y="552" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#f3f6fb">Stopped-state comparison; service resumed</text><path d="M300 588L300 617" stroke="#60b5ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="625" width="540" height="126" rx="20" fill="#142235" stroke="#29415e" stroke-width="2"/><text x="52" y="667" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#60b5ff">Complete the assessment</text><text x="52" y="711" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#f3f6fb">Evidence + final source + required CI</text><path d="M300 754L300 783" stroke="#60b5ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="790" width="540" height="126" rx="20" fill="#12332e" stroke="#29415e" stroke-width="2"/><text x="52" y="834" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#52d5aa">Owner accepts scoped readiness</text><text x="52" y="877" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#f3f6fb">Recorded limits remain in force</text></svg>
