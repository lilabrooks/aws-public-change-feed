name: Repository security

"on":
  pull_request:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Scan pinned Python manifests and tracked plaintext
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.74.0
          cache-dir: ${{ runner.temp }}/trivy-cache

  terraform-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Findings remain visible and classified. Scanner errors or any change
      # from the reviewed root-scoped baseline fail this job.
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514  # v0.2.6
        with:
          version: v0.74.0
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install baseline comparator dependency
        run: python -m pip install --no-deps --constraint requirements.txt PyYAML

      - name: Scan Terraform roots as separate entry points
        run: |
          trivy config --config trivy.yaml --scanners misconfig --severity LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 --format json --output trivy-terraform-bootstrap.json infra/bootstrap
          trivy config --config trivy.yaml --scanners misconfig --severity LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 --format json --output trivy-terraform-central.json infra/central
          trivy config --config trivy.yaml --scanners misconfig --severity LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 --format json --output trivy-terraform-preflight.json infra/preflight

      - name: Compare Terraform findings with the reviewed baseline
        run: |
          python scripts/compare_trivy_baseline.py \
            --baseline .github/trivy-terraform-baseline.yml \
            --result bootstrap=trivy-terraform-bootstrap.json \
            --result central=trivy-terraform-central.json \
            --result preflight=trivy-terraform-preflight.json
