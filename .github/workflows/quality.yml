name: Repository quality

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      # Without terraform on the runner, make check's terraform-check target
      # skips and the Terraform roots get no CI coverage at all.
      # terraform_wrapper adds a shim around the binary; the Makefile reads exit
      # codes directly, so it is off.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check public page content sync
        if: github.event_name != 'workflow_dispatch'
        env:
          SITE_SYNC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_site.py --base "$SITE_SYNC_BASE" --head "$GITHUB_SHA"

      - name: Run repository checks
        run: make check PYTHON=python
