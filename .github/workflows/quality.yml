name: Repository quality

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      # Without terraform on the runner, make check's terraform-check target
      # skips and the Terraform roots get no CI coverage at all.
      # terraform_wrapper adds a shim around the binary; the Makefile reads exit
      # codes directly, so it is off.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check public page content sync
        if: github.event_name != 'workflow_dispatch'
        env:
          SITE_SYNC_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_site.py --base "$SITE_SYNC_BASE" --head "$GITHUB_SHA"

      - name: Run repository checks
        env:
          CHECK_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          CHECK_DIFF_HEAD: ${{ github.sha }}
        run: make check PYTHON=python REQUIRE_TERRAFORM=1

  # Exercise ADR-006's minimum supported Terraform without repeating the
  # Python, contract, corpus, and site suites from the primary job.
  terraform-minimum:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Confirm minimum Terraform version
        run: |
          terraform version
          test "$(terraform version | sed -n '1p')" = "Terraform v1.10.0"

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6.3.0
        with:
          tflint_version: v0.64.0
          checksums: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
          cache: true
          tflint_config_path: .tflint.hcl

      - name: Validate Terraform roots and run TFLint at the minimum version
        run: make terraform-check tflint-check REQUIRE_TERRAFORM=1 REQUIRE_TFLINT=1
